# docker compose up --build   ->  app on http://localhost:3000 , API on http://localhost:8080
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: proppilot
      POSTGRES_USER: proppilot
      POSTGRES_PASSWORD: proppilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proppilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/proppilot
      DB_USER: proppilot
      DB_PASSWORD: proppilot
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-90}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-10}
      CHAT_MAX_HISTORY_ITEMS: ${CHAT_MAX_HISTORY_ITEMS:-20}
      ACTION_TTL_MINUTES: ${ACTION_TTL_MINUTES:-15}
      ACTION_DECISIONS_PER_MINUTE: ${ACTION_DECISIONS_PER_MINUTE:-30}
      ACTION_MAX_APPROVALS_PER_DAY: ${ACTION_MAX_APPROVALS_PER_DAY:-100}
      ACTION_MAX_PROPOSALS_PER_RUN: ${ACTION_MAX_PROPOSALS_PER_RUN:-3}
      ACTION_MAX_PROPOSALS_PER_DAY: ${ACTION_MAX_PROPOSALS_PER_DAY:-200}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RAG_SEED_ON_STARTUP: ${RAG_SEED_ON_STARTUP:-true}
      RAG_DOCUMENT_COUNT: ${RAG_DOCUMENT_COUNT:-30}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage-4-lite}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-proppilot}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
