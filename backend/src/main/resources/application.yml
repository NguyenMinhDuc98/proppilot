spring:
  application:
    name: proppilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/proppilot}
    username: ${DB_USER:proppilot}
    password: ${DB_PASSWORD:proppilot}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true

proppilot:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  llm:
    provider: ${LLM_PROVIDER:offline}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
    api-url: https://api.anthropic.com/v1/messages
    max-tokens: ${LLM_MAX_TOKENS:2048}
    timeout-seconds: 60
    max-retries: ${LLM_MAX_RETRIES:3}
    retry-base-delay-ms: 1000
    price-input-per-mtok: ${LLM_PRICE_INPUT_PER_MTOK:1.00}
    price-output-per-mtok: ${LLM_PRICE_OUTPUT_PER_MTOK:5.00}
    # What a prompt-cache write and read cost, as multiples of the input price (5-minute cache)
    cache-write-multiplier: ${LLM_CACHE_WRITE_MULTIPLIER:1.25}
    cache-read-multiplier: ${LLM_CACHE_READ_MULTIPLIER:0.10}
    # Mark the tools, the system prompt and the conversation so far for the API to cache. The API caches only what is
    # longer than a per-model minimum, so a hit is never assumed: the tokens it reports are recorded and priced
    prompt-caching: ${PROMPT_CACHING:true}
    # A larger model, for the questions and calls that need it. Empty means there is none
    large-model: ${ANTHROPIC_MODEL_LARGE:}
    large-price-input-per-mtok: ${LLM_LARGE_PRICE_INPUT_PER_MTOK:3.00}
    large-price-output-per-mtok: ${LLM_LARGE_PRICE_OUTPUT_PER_MTOK:15.00}
    # The score from which a question goes to the larger model (see ComplexityRule for what scores)
    complexity-threshold: ${LLM_COMPLEXITY_THRESHOLD:3}
  embedding:
    provider: ${EMBEDDING_PROVIDER:none}
    api-key: ${VOYAGE_API_KEY:}
    model: ${EMBEDDING_MODEL:voyage-4-lite}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
    api-url: https://api.voyageai.com/v1/embeddings
    timeout-seconds: 20
    max-retries: 3
    retry-base-delay-ms: 1000
  agent:
    max-iterations: 6
    max-history-turns: 10
    run-timeout-seconds: ${AGENT_RUN_TIMEOUT_SECONDS:90}
  # off | warn | retry. warn flags an answer that states a figure, a code, a name or a citation that nothing in the run
  # supports; retry also asks for such an answer once more. Anything else stops the backend from starting
  guardrail:
    mode: ${GUARDRAIL_MODE:warn}
  admin:
    token: ${ADMIN_TOKEN:}
  # The spans are exported only when enabled and there is an endpoint; the exporter itself reads the standard OTEL_*
  # variables, so the endpoint is bound here only to know whether there is one
  otel:
    enabled: ${OTEL_ENABLED:false}
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
  chat:
    max-message-length: ${CHAT_MAX_MESSAGE_LENGTH:500}
    max-history-items: ${CHAT_MAX_HISTORY_ITEMS:20}
    max-history-turn-length: 4000
    rate-limit-per-minute: ${CHAT_RATE_LIMIT_PER_MINUTE:10}
    daily-limit: ${CHAT_DAILY_LIMIT:500}
  actions:
    ttl-minutes: ${ACTION_TTL_MINUTES:15}
    decisions-per-minute: ${ACTION_DECISIONS_PER_MINUTE:30}
    max-approvals-per-day: ${ACTION_MAX_APPROVALS_PER_DAY:100}
    max-proposals-per-run: ${ACTION_MAX_PROPOSALS_PER_RUN:3}
    max-proposals-per-day: ${ACTION_MAX_PROPOSALS_PER_DAY:200}
  rag:
    document-count: ${RAG_DOCUMENT_COUNT:30}
    seed-on-startup: ${RAG_SEED_ON_STARTUP:true}
