name: Evals (full)

# The full evaluation, started by hand: real Claude behind the backend, every case (the ones that only a real model can
# pass included) and, when asked, an LLM judge for tone, language and grounding. It spends money on the Anthropic API,
# roughly one question per case and run plus the earlier turns of the follow-up cases and the judge's calls (see
# evals/README.md), so it never runs on its own.
#
# It needs the repository secret ANTHROPIC_API_KEY, which only the steps that call the API receive, and is skipped with
# a notice without it. The key is never echoed.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Times each case is run, 1 to 10
        type: string
        default: '3'
      judge:
        description: Score tone, language and grounding with an LLM judge
        type: boolean
        default: true
      prompt_caching:
        description: PROMPT_CACHING of the backend
        type: boolean
        default: true
      guardrail_mode:
        description: GUARDRAIL_MODE of the backend
        type: choice
        options: [warn, retry, off]
        default: warn
      only:
        description: Comma-separated id prefixes to run (en-,ar-,write-,rag-,multi-,turn-,ambig-,scope-,inject-,trap-); empty runs every case
        type: string
        default: ''
      large_model:
        description: ANTHROPIC_MODEL_LARGE of the backend; empty switches routing and fallback to a second model off
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: evals-full
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    # 70 questions or so per run, a few seconds each, 10 runs at the most; the harness step has its own, shorter limit.
    timeout-minutes: 120
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: proppilot
          POSTGRES_USER: proppilot
          POSTGRES_PASSWORD: proppilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proppilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check that the API key is set
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice title=Full evals skipped::Add the repository secret ANTHROPIC_API_KEY to run them."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the inputs
        if: steps.key.outputs.present == 'true'
        env:
          RUNS: ${{ inputs.runs }}
          ONLY: ${{ inputs.only }}
          LARGE_MODEL: ${{ inputs.large_model }}
        run: |
          # Inputs reach the shell as environment variables and are checked here, never pasted into a command.
          if ! [[ "$RUNS" =~ ^([1-9]|10)$ ]]; then
            echo "::error title=Bad input::runs must be a whole number from 1 to 10"
            exit 1
          fi
          if ! [[ "$ONLY" =~ ^[A-Za-z0-9,_-]*$ ]]; then
            echo "::error title=Bad input::only holds letters, digits, commas, hyphens and underscores"
            exit 1
          fi
          if ! [[ "$LARGE_MODEL" =~ ^[A-Za-z0-9._-]*$ ]]; then
            echo "::error title=Bad input::large_model is a model id"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build the backend
        if: steps.key.outputs.present == 'true'
        working-directory: backend
        run: ./mvnw -B -q -DskipTests package

      - name: Start the backend with real Claude
        if: steps.key.outputs.present == 'true'
        env:
          DB_URL: jdbc:postgresql://localhost:5432/proppilot
          DB_USER: proppilot
          DB_PASSWORD: proppilot
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPT_CACHING: ${{ inputs.prompt_caching }}
          GUARDRAIL_MODE: ${{ inputs.guardrail_mode }}
          ANTHROPIC_MODEL_LARGE: ${{ inputs.large_model }}
          # High limits: the runner sends its questions one after another without a pause.
          CHAT_RATE_LIMIT_PER_MINUTE: '1000'
          CHAT_DAILY_LIMIT: '100000'
          ACTION_MAX_PROPOSALS_PER_DAY: '10000'
        run: |
          jar=$(ls backend/target/proppilot-*.jar | grep -v '\.original$' | head -n 1)
          nohup java -jar "$jar" > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for the backend and its lease documents
        if: steps.key.outputs.present == 'true'
        run: |
          ready=false
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error title=Backend did not start::No healthy answer within 2 minutes"
            tail -n 50 backend.log
            exit 1
          fi
          ready=false
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/info | grep -q '"leaseDocuments":30'; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error title=Lease documents missing::The 30 lease documents were not written within 2 minutes"
            curl -s http://localhost:8080/api/info
            tail -n 50 backend.log
            exit 1
          fi

      - name: Run the evals
        if: steps.key.outputs.present == 'true'
        timeout-minutes: 100
        env:
          RUNS: ${{ inputs.runs }}
          JUDGE: ${{ inputs.judge }}
          ONLY: ${{ inputs.only }}
          # Read by the judge only, and only with --judge.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=(--runs "$RUNS" --out evals-out/latest.json --summary evals-out/latest.md)
          if [ "$JUDGE" = "true" ]; then args+=(--judge); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          node evals/run.mjs "${args[@]}"

      - name: Show the summary
        if: always() && steps.key.outputs.present == 'true'
        run: |
          if [ -f evals-out/latest.md ]; then cat evals-out/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: evals-full
          path: evals-out/
          if-no-files-found: ignore
      - name: Stop the backend
        if: always() && steps.key.outputs.present == 'true'
        run: |
          if [ -f backend.pid ]; then kill "$(cat backend.pid)" || true; fi
