# Render Blueprint: the backend on Render's free web service.
# The database is a free Neon Postgres (Render's free Postgres expires), so DB_* are set by hand in the dashboard.
services:
  - type: web
    name: proppilot-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    # Only backend changes redeploy the API; README, frontend and eval pushes leave the running service alone.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DB_URL          # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS   # your Vercel URL, e.g. https://proppilot.vercel.app
        sync: false
      # Set in the Render dashboard: "offline" (free, no key) or "anthropic" (needs ANTHROPIC_API_KEY).
      # Deliberately not given a value here: a value in this file would overwrite the dashboard on every blueprint sync.
      - key: LLM_PROVIDER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Set in the Render dashboard: "none" (lease search by keywords, free) or "voyage" (also by meaning; needs
      # VOYAGE_API_KEY). Deliberately not given a value here, for the same reason as LLM_PROVIDER. Unset or blank
      # means "none". EMBEDDING_MODEL is optional and is added in the dashboard when wanted.
      - key: EMBEDDING_PROVIDER
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      # Enables GET /api/admin/runs and POST /api/admin/reset (the nightly demo reset sends this value from the
      # ADMIN_TOKEN repository secret). 24+ characters (openssl rand -hex 24). Leave unset to switch the admin endpoints off.
      - key: ADMIN_TOKEN
        sync: false
      # A larger model for the questions that are multi-step or complex, for a guardrail retry and as the fallback when
      # ANTHROPIC_MODEL is overloaded (for example claude-sonnet-4-5). Set in the dashboard, like LLM_PROVIDER, and for
      # the same reason. Unset or blank means there is no larger model: routing and the fallback to a second model are
      # off and every question goes to ANTHROPIC_MODEL. Its prices default to Sonnet's; for another model also add
      # LLM_LARGE_PRICE_INPUT_PER_MTOK and LLM_LARGE_PRICE_OUTPUT_PER_MTOK (USD per million tokens) in the dashboard.
      - key: ANTHROPIC_MODEL_LARGE
        sync: false
      # Where OpenTelemetry sends its spans, an OTLP/HTTP address such as https://otlp.example.com. Set in the
      # dashboard, for the same reason. Unset or blank means no export, even with OTEL_ENABLED set to true: the backend
      # starts and logs a warning. OTEL_EXPORTER_OTLP_HEADERS (the collector's credentials, key=value pairs separated by
      # commas) and OTEL_SERVICE_NAME (default proppilot) are optional and are added in the dashboard when wanted.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      # Given a value here, so a change to these three is a change to this file: the next blueprint sync restores what
      # is written below over anything set in the dashboard. OTEL_ENABLED exports every question as spans (never a
      # prompt, an answer or a tool's arguments) once OTEL_EXPORTER_OTLP_ENDPOINT is set; "false" exports nothing.
      - key: PROMPT_CACHING
        value: "true"
      - key: GUARDRAIL_MODE
        value: "warn"
      - key: OTEL_ENABLED
        value: "false"
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: CHAT_DAILY_LIMIT
        value: "100"
      - key: ACTION_TTL_MINUTES
        value: "15"
      - key: ACTION_DECISIONS_PER_MINUTE
        value: "30"
      - key: ACTION_MAX_APPROVALS_PER_DAY
        value: "100"
      - key: ACTION_MAX_PROPOSALS_PER_RUN
        value: "3"
      - key: ACTION_MAX_PROPOSALS_PER_DAY
        value: "200"
      # How many leases get a generated lease document (the first 30 active leases by id).
      - key: RAG_DOCUMENT_COUNT
        value: "30"
