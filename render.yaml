# Render Blueprint: the backend on Render's free web service.
# The database is a free Neon Postgres (Render's free Postgres expires), so DB_* are set by hand in the dashboard.
services:
  - type: web
    name: proppilot-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    # Only backend changes redeploy the API; README, frontend and eval pushes leave the running service alone.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DB_URL          # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS   # your Vercel URL, e.g. https://proppilot.vercel.app
        sync: false
      # Set in the Render dashboard: "offline" (free, no key) or "anthropic" (needs ANTHROPIC_API_KEY).
      # Deliberately not given a value here: a value in this file would overwrite the dashboard on every blueprint sync.
      - key: LLM_PROVIDER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Set in the Render dashboard: "none" (lease search by keywords, free) or "voyage" (also by meaning; needs
      # VOYAGE_API_KEY). Deliberately not given a value here, for the same reason as LLM_PROVIDER. Unset or blank
      # means "none". EMBEDDING_MODEL is optional and is added in the dashboard when wanted.
      - key: EMBEDDING_PROVIDER
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      # Enables GET /api/admin/runs and POST /api/admin/reset (the nightly demo reset sends this value from the
      # ADMIN_TOKEN repository secret). 24+ characters (openssl rand -hex 24). Leave unset to switch the admin endpoints off.
      - key: ADMIN_TOKEN
        sync: false
      # Optional, added in the dashboard when wanted and so not listed here: OTEL_ENABLED=true exports every question as
      # OpenTelemetry spans (never prompts, answers or tool arguments) to OTEL_EXPORTER_OTLP_ENDPOINT, with
      # OTEL_EXPORTER_OTLP_HEADERS for its credentials and OTEL_SERVICE_NAME (default proppilot). Give the endpoint
      # whenever it is on: an empty one stops the backend from starting. Unset means off.
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: CHAT_DAILY_LIMIT
        value: "100"
      - key: ACTION_TTL_MINUTES
        value: "15"
      - key: ACTION_DECISIONS_PER_MINUTE
        value: "30"
      - key: ACTION_MAX_APPROVALS_PER_DAY
        value: "100"
      - key: ACTION_MAX_PROPOSALS_PER_RUN
        value: "3"
      - key: ACTION_MAX_PROPOSALS_PER_DAY
        value: "200"
      # How many leases get a generated lease document (the first 30 active leases by id).
      - key: RAG_DOCUMENT_COUNT
        value: "30"
